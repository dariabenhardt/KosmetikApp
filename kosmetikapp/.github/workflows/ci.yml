
name: Kosmetikapp CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node.js dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install Node.js dependencies (without lockfile)
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') == ''
        run: npm install

      - name: Build and test with Node.js
        if: hashFiles('package.json') != ''
        run: npm run build --if-present && npm test --if-present
